<!doctype html><meta charset="utf-8"><body style="margin:0;background:#0B1A3A">
<svg id="s" viewBox="0 0 1600 900" width="800" height="450">
 <path id="a" d="M 500 450 m -200 0 a 200 200 0 1 0 400 0 a 200 200 0 1 0 -400 0" fill="#22D3EE"/>
 <path id="b" d="M 900 250 L 1300 250 L 1300 650 L 900 650 Z" fill="none" visibility="hidden"/>
 <path id="line" d="M 100 800 C 400 600 800 900 1500 700" stroke="#FFB703" stroke-width="14" fill="none"/>
 <circle id="dot" r="30" fill="#EF476F"/>
</svg>
<script src="./node_modules/gsap/dist/gsap.min.js"></script>
<script src="./node_modules/gsap/dist/MorphSVGPlugin.min.js"></script>
<script src="./node_modules/gsap/dist/DrawSVGPlugin.min.js"></script>
<script src="./node_modules/gsap/dist/MotionPathPlugin.min.js"></script>
<script>
gsap.registerPlugin(MorphSVGPlugin, DrawSVGPlugin, MotionPathPlugin);
const tl = gsap.timeline({ paused: true });
tl.to('#a', { duration: 2, morphSVG: '#b', ease: 'power2.inOut' }, 0)
  .from('#line', { duration: 2, drawSVG: 0 }, 0.5)
  .to('#dot', { duration: 3, motionPath: { path: '#line', align: '#line', alignOrigin: [0.5, 0.5] }, ease: 'none' }, 0);
window.render = t => { tl.seek(t, false); return document.getElementById('a').getAttribute('d').slice(0, 60); };
</script>
