function plaque(p, x, y, text, o = {}) { const size = o.size || 52, mono = o.mono !== false, w = text.length * size * (mono ? .62 : .56) + 70, h = size + 44;

  for (let i = 0; i < Math.round(w / 70); i++) { const x = cx - w / 2 + rnd() * w, y = cy - rnd() * h * .5, r = 60 + rnd() * 100; el('circle', { cx: x, cy: y, r, fill: 'url(#cloudTop)' }, c); }

  return c; }

  el('rect', { x: -6, y: 0, width: 12, height: 70, fill: '#2c2560' }, b);
  el('rect', { x: -60, y: -40, width: 100, height: 54, rx: 12, fill: '#d9d4f2' }, b); el('path', { d: 'M 40 -30 L 70 -42 L 70 6 L 40 -6 Z', fill: '#b9b2e3' }, b);
  el('circle', { cx: 52, cy: -18, r: 9, fill: '#2a2357' }, b);
  const ledHalo = el('circle', { cx: -40, cy: -26, r: 34, fill: led0 === 'on' ? 'url(#greenHalo)' : 'none' }, b);
  const led = el('circle', { cx: -40, cy: -26, r: 9, fill: led0 === 'on' ? C.green : '#3b3766' }, b); g._led = led; g._halo = ledHalo; return g; }
const ledOn = (cam, t, col = C.green, halo = 'url(#greenHalo)') => { tl.set(cam._led, { attr: { fill: col } }, t); tl.set(cam._halo, { attr: { fill: halo } }, t); };
function reactor(p, x, y, s, on = true) { const g = G(p, x, y); const b = el('g', { transform: `scale(${s})` }, g);
  const halo = el('circle', { cx: 0, cy: -40, r: 280, fill: 'url(#coreHalo)', opacity: on ? 1 : 0 }, b);
  el('path', { d: 'M -170 30 A 170 170 0 0 1 170 30 Z', fill: '#bfe9ff', 'fill-opacity': .12, stroke: '#d8f3ff', 'stroke-width': 7 }, b);
  el('rect', { x: -200, y: 30, width: 400, height: 46, rx: 14, fill: '#2c2560' }, b);
  const coreOff = el('circle', { cx: 0, cy: -40, r: 72, fill: 'url(#coreOff)' }, b);
  const core = el('circle', { cx: 0, cy: -40, r: 72, fill: 'url(#core)', filter: 'url(#glow)', opacity: on ? 1 : 0 }, b);
  const r1 = el('ellipse', { cx: 0, cy: -40, rx: 124, ry: 34, fill: 'none', stroke: '#ffe08a', 'stroke-width': 6, opacity: on ? .85 : .15 }, b);
  const r2 = el('ellipse', { cx: 0, cy: -40, rx: 34, ry: 118, fill: 'none', stroke: '#ffd166', 'stroke-width': 5, opacity: on ? .65 : .1 }, b);
  g._ignite = t => { tl.to([core, halo], { opacity: 1, duration: .6 }, t).to(r1, { opacity: .85, duration: .6 }, t).to(r2, { opacity: .65, duration: .6 }, t);
    tl.fromTo(core, { attr: { r: 30 } }, { attr: { r: 72 }, duration: .7, ease: 'back.out(2)' }, t); sfx(t, 'impact'); };
  g._spin = (t0, d) => { tl.to(r1, { rotation: 360 * Math.floor(d / 6), svgOrigin: '0 -40', duration: Math.floor(d / 6) * 6, ease: 'none' }, t0); tl.to(r2, { rotation: -360 * Math.floor(d / 4.5), svgOrigin: '0 -40', duration: Math.floor(d / 4.5) * 4.5, ease: 'none' }, t0); };
  return g; }

  el('circle', { cx: 0, cy: -10, r: 90, fill: 'url(#coreHalo)', opacity: .6 }, b);

  el('circle', { cx: 0, cy: 42, r: 12, fill: '#c98a00' }, b); el('rect', { x: -8, y: -76, width: 16, height: 16, rx: 6, fill: '#c98a00' }, b); return g; }
const ring = (b, t) => { tl.to(b, { rotation: 16, transformOrigin: '50% 0%', duration: .09, yoyo: true, repeat: 9, ease: 'sine.inOut' }, t); sfx(t, 'impact'); };

  el('circle', { cx: -26, cy: 0, r: 22, fill: 'none', stroke: col, 'stroke-width': 11 }, b); el('rect', { x: -6, y: -6, width: 70, height: 12, rx: 5, fill: col }, b);

<script type="module">
/* Rive characters: compiled from RML by Rive CLI, drawn from a fresh state whenever time goes backwards. */
import Rive from './lib/rive/webgl2_advanced.mjs';
const ready = (async () => {
  const rive = await Rive({ locateFile: f => './lib/rive/' + (f.endsWith('.wasm') ? 'rive.wasm' : f) });

  for (const [name, file] of [['thief', 'thief.riv'], ['hero', 'analyst.riv']]) {
    const f = await rive.load(new Uint8Array(await (await fetch(file)).arrayBuffer()));
    const def = window.__CHARS[name], canvas = document.getElementById(def.canvas);
    inst[name] = { f, def, canvas, renderer: rive.makeRenderer(canvas, true), ab: null, sm: null, vmi: null, cur: -1 }; }
  const reset = I => { I.ab = I.f.defaultArtboard(); I.sm = new rive.StateMachineInstance(I.ab.stateMachineByIndex(0), I.ab);
    I.vmi = I.f.defaultArtboardViewModel(I.ab).defaultInstance(); I.ab.bindViewModelInstance(I.vmi); I.sm.bindViewModelInstance(I.vmi); I.cur = 0; };
